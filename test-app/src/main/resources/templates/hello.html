<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lumen Framework | Status Dashboard</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .status-on { color: #2ecc71; font-weight: bold; }
        .status-off { color: #e74c3c; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
        th { background: #eee; }
        .footer { font-size: 0.8em; color: #666; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h1>Welcome to <span th:text="${frameworkName}">Framework</span></h1>
    <p>User: <strong th:text="${user != null ? user.name : 'Anonymous'}">Guest</strong></p>
    <p>Environment: <span th:class="${isDev} ? 'status-on' : 'status-off'"
                          th:text="${isDev} ? 'DEVELOPMENT' : 'PRODUCTION'">MODE</span></p>
</div>

<div class="card">
    <h3>Registered Routes (Collection Iteration)</h3>
    <table>
        <thead>
        <tr>
            <th>Path</th>
            <th>Method</th>
            <th>Controller Method</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="route : ${routes}">
            <td th:text="${route.pathPattern}">/index</td>
            <td th:text="${route.httpMethod}">GET</td>
            <td th:text="${route.method.name}">handleIndex</td>
        </tr>
        <tr th:if="${#lists.isEmpty(routes)}">
            <td colspan="3">No routes found in registry.</td>
        </tr>
        </tbody>
    </table>
</div>

<div class="card">
    <h3>Server Information</h3>
    <ul>
        <li><strong>Current Time:</strong> <span th:text="${#temporals.format(currentTime, 'yyyy-MM-dd HH:mm:ss')}">00:00</span></li>
        <li><strong>Port:</strong> <span th:text="${serverPort}">8080</span></li>
        <li><strong>Java Version:</strong> <span th:text="${#conversions.convert(javaVersion, 'String')}">17</span></li>
    </ul>
</div>

<div class="footer">
    <p>Lumen Framework &copy; 2026</p>
</div>

</body>
</html>
